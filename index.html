<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Trend - Game Adventure</title>
    
    <meta property="og:title" content="Secret Trend - Interactive Game">
    <meta property="og:description" content="Tap to start running and jumping adventure!">
    <meta property="og:image" content="https://secrettrend.shop/banner.jpg">
    <meta property="og:url" content="https://secrettrend.shop/">
    <meta property="og:type" content="website">

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background: #111827;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Game Screen Container */
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: linear-gradient(to bottom, #1e293b, #0f172a);
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }

        /* City/Road Background */
        .city-background {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(90deg, #1e293b 0px, #1e293b 100px, #334155 100px, #334155 102px);
            opacity: 0.3;
            z-index: 1;
        }

        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 80px;
            background: #0f172a;
            border-top: 4px solid #f6ad55;
            z-index: 2;
        }

        /* Start Screen Overlay */
        .start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-title {
            font-family: 'Georgia', serif;
            font-size: 28px;
            color: #f9fafb;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-align: center;
        }

        .start-subtitle {
            font-size: 14px;
            color: #f6ad55;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .tap-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            padding: 15px 35px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(217, 119, 6, 0.4); }
            50% { transform: scale(1.08); box-shadow: 0 0 30px rgba(217, 119, 6, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(217, 119, 6, 0.4); }
        }

        /* Game Character / Runner */
        .runner {
            position: absolute;
            bottom: 80px;
            left: -100px;
            font-size: 70px;
            z-index: 5;
            transition: transform 0.3s ease;
        }

        /* Running Animation Class */
        .runner.run {
            animation: moveAndRun 4s linear forwards, bounceRun 0.3s infinite alternate;
        }

        @keyframes moveAndRun {
            0% { left: -100px; }
            50% { left: 45%; }
            60% { transform: translateY(-120px) scale(1.1); } /* Jump in the middle */
            70% { transform: translateY(0) scale(1); }
            100% { left: 110%; }
        }

        @keyframes bounceRun {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* Game Status Text */
        .game-status {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            color: #9ca3af;
            z-index: 4;
        }
    </style>
</head>
<body>

    <div class="game-container" id="gameContainer">
        <div class="city-background"></div>
        <div class="game-status" id="gameStatus">TAP SCREEN TO START GAME</div>
        <div class="ground"></div>

        <div class="runner" id="runner">🐎</div>

        <div class="start-overlay" id="startOverlay" onclick="startGame()">
            <div class="start-title">SECRET TREND</div>
            <div class="start-subtitle">City Adventure Game</div>
            <div class="tap-btn">▶️ TOUCH TO START</div>
        </div>
    </div>

    <script>
        function startGame() {
            const overlay = document.getElementById('startOverlay');
            const runner = document.getElementById('runner');
            const status = document.getElementById('gameStatus');

            // Fade out start screen
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 500);

            // Update status text
            status.innerText = "RUNNING & JUMPING...";

            // Trigger running and jumping animation
            runner.classList.add('run');

            // Reset after animation finishes so player can restart if needed
            setTimeout(() => {
                status.innerText = "GAME COMPLETED! TAP TO REPLAY";
                overlay.style.display = 'flex';
                overlay.style.opacity = '1';
                runner.classList.remove('run');
                runner.style.left = '-100px';
            }, 4200);
        }
    </script>
</body>
</html>
