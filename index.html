<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spin Wheel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
    }

    .container {
      text-align: center;
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }

    .wheel-box {
      position: relative;
      margin: 20px auto;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      border: 8px solid #FF9933;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #138808;
      color: white;
      text-align: center;
      box-sizing: border-box;
      padding: 10px;
    }

    .spin-btn {
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #FF9933;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .spin-btn:hover {
      background-color: #e68a00;
    }

    .result-text {
      font-size: 18px;
      font-weight: bold;
      color: #333;
      margin-top: 15px;
    }

    .code-highlight {
      color: #d9534f;
      font-size: 22px;
      display: block;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="wheel-box" id="wheel">
    <h3 id="wheelText">SPIN</h3>
  </div>

  <button class="spin-btn" onclick="spinWheel()">SPIN</button>

  <div class="result-text" id="result"></div>
</div>

<script>
  function spinWheel() {
    const wheelText = document.getElementById('wheelText');
    const result = document.getElementById('result');
    
    // സ്പിൻ ചെയ്യുമ്പോൾ 80-ാമത് സ്വാതന്ത്ര്യദിനം എന്ന് കാണിക്കുന്നു
    wheelText.innerHTML = "Happy Independence Day!<br>80th Independence Day";
    
    // ഫലമായി ഓഫർ കോഡ് കാണിക്കുന്നു
    result.innerHTML = 'Go with your code: <span class="code-highlight">FREEDOM2026</span>';
  }
</script>

</body>
</html>
