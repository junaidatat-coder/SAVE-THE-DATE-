<head>
    
    <meta charset="UTF-8">

</head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Trend - Sunday Funday Student Offer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #070913 0%, #0b0f19 50%, #111827 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Logo Header */
        header {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(10px);
        }

        .logo-main {
            font-family: 'Georgia', serif;
            font-size: 20px;
            letter-spacing: 3px;
            color: #f9fafb;
            font-weight: 500;
            text-transform: uppercase;
        }

        .logo-sub {
            font-size: 9px;
            letter-spacing: 4px;
            color: #f6ad55;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .container {
            text-align: center;
            padding: 25px 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-main {
            font-family: 'Georgia', serif;
            font-size: 30px;
            font-weight: 400;
            margin: 5px 0 0 0;
            color: #f9fafb;
            letter-spacing: 1px;
        }

        .title-sub {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 28px;
            color: #f6ad55;
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px rgba(246, 173, 85, 0.3);
        }

        .badge-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.4);
            margin-bottom: 25px;
            border: none;
        }

        /* Spinning Circle Effect */
        .circle-box {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, #065f46 0%, #022c22 100%);
            border-radius: 50%;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(6, 95, 70, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.1);
            position: relative;
            cursor: pointer;
            transition: transform 1.2s cubic-bezier(0.15, 0.85, 0.35, 1.2);
            border: 2px solid rgba(52, 211, 153, 0.3);
        }

        .circle-box.spin {
            transform: rotate(720deg);
        }

        .circle-box::after {
            content: '';
            position: absolute;
            width: 175px;
            height: 175px;
            border: 2px dashed rgba(255, 255, 255, 0.35);
            border-radius: 50%;
        }

        .circle-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #ffffff;
            z-index: 1;
            text-align: center;
            padding: 0 20px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
            line-height: 1.4;
        }

        .theme-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            border: none;
            padding: 13px 32px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(217, 119, 6, 0.4);
            margin-bottom: 25px;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .theme-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.6);
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .countdown-box {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(246, 173, 85, 0.25);
            border-radius: 12px;
            width: 65px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
        }

        .countdown-number {
            font-family: 'Georgia', serif;
            font-size: 22px;
            color: #f6ad55;
            font-weight: bold;
        }

        .countdown-label {
            font-size: 9px;
            letter-spacing: 1.2px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .event-date {
            font-size: 12px;
            letter-spacing: 2px;
            color: #e5e7eb;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .footer-links {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            letter-spacing: 1.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 15px;
            width: 100%;
        }

        .footer-links a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #f6ad55;
        }
    </style>
</head>
<body>

    <!-- Minimalist Premium Logo Header -->
    <header>
        <div class="logo-main">SECRET TREND</div>
        <div class="logo-sub">Premium Collectibles</div>
    </header>

    <div class="container">
        <h1 class="title-main">Secret Trend</h1>
        <div class="title-sub">Sunday Funday Offer</div>

        <div class="badge-btn">
            ⚡ FLAT 10% TO 40% OFF ⚡
        </div>

        <!-- Interactive Spinning Circle with Sequence Results -->
        <div class="circle-box" id="spinCircle" onclick="triggerSpin()">
            <div class="circle-text" id="spinText">SPIN FOR<br>STUDENT OFFER</div>
        </div>

        <!-- Active Website Link Button -->
        <a href="https://secrettrend.shop/" target="_blank" class="theme-btn">🛍️ ORDER ON WEBSITE</a>

        <!-- Live Countdown Timer for Next Sunday -->
        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">DAYS</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">HOURS</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">MINUTES</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">SECONDS</span>
            </div>
        </div>

        <div class="event-date" id="eventDateText">SUNDAY • LOADING...</div>

        <!-- Clean Footer Links -->
        <div class="footer-links">
            <a href="https://secrettrend.shop/" target="_blank">secrettrend.shop</a>
            <a href="https://instagram.com" target="_blank">secrettrend.shop Instagram</a>
        </div>
    </div>

    <script>
        let spinCount = 0;

        // Spin Animation & Sequential Results Function
        function triggerSpin() {
            const circle = document.getElementById('spinCircle');
            const spinText = document.getElementById('spinText');
            
            circle.classList.remove('spin');
            void circle.offsetWidth; // Trigger reflow
            circle.classList.add('spin');

            spinCount++;

            setTimeout(() => {
                if (spinCount === 1) {
                    spinText.innerHTML = "YOU GOT<br>10% OFF";
                } else if (spinCount === 2) {
                    spinText.innerHTML = "YOU GOT<br>10% OFF";
                } else {
                    spinText.innerHTML = "NO OFFER<br>FOUND";
                    spinCount = 0; // Reset cycle after the 3rd spin
                }
            }, 600);
        }

        // Calculate Next Sunday Countdown
        function getNextSunday() {
            const now = new Date();
            const resultDate = new Date(now.getTime());
            
            const dayOfWeek = now.getDay(); // 0 is Sunday
            const daysUntilSunday = (7 - dayOfWeek) % 7;
            
            if (daysUntilSunday === 0) {
                resultDate.setDate(now.getDate() + 7);
            } else {
                resultDate.setDate(now.getDate() + daysUntilSunday);
            }
            
            resultDate.setHours(10, 0, 0, 0);
            return resultDate;
        }

        const targetDate = getNextSunday();

        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('eventDateText').innerText = targetDate.toLocaleDateString('en-US', options).toUpperCase();

        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
