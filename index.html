<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Trend - Mega Student Offer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 25px;
            padding: 20px 0;
            font-size: 13px;
            letter-spacing: 2px;
            font-weight: 600;
            color: #8da4ef;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        header span {
            cursor: pointer;
            transition: color 0.3s;
        }

        header span:hover {
            color: #ffffff;
        }

        .container {
            text-align: center;
            padding: 30px 20px;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
        }

        .title-main {
            font-family: 'Georgia', serif;
            font-size: 36px;
            font-weight: 400;
            margin: 10px 0 0 0;
            color: #f3f4f6;
        }

        .title-sub {
            font-family: 'Georgia', serif;
            font-style: italic;
            font-size: 38px;
            color: #f6ad55;
            margin: 0 0 25px 0;
            text-shadow: 0 0 15px rgba(246, 173, 85, 0.4);
        }

        .badge-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            padding: 14px 25px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 20px rgba(217, 119, 6, 0.5);
            margin-bottom: 35px;
            border: none;
        }

        .circle-box {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle, #f43f5e 0%, #3b82f6 100%);
            border-radius: 50%;
            margin: 0 auto 35px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(244, 63, 94, 0.4);
            position: relative;
        }

        .circle-box::after {
            content: '';
            position: absolute;
            width: 185px;
            height: 185px;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .circle-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
            z-index: 1;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .theme-btn {
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.4);
            margin-bottom: 40px;
        }

        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .countdown-box {
            background: #111827;
            border: 1px solid rgba(246, 173, 85, 0.3);
            border-radius: 12px;
            width: 65px;
            height: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .countdown-number {
            font-family: 'Georgia', serif;
            font-size: 22px;
            color: #f6ad55;
            font-weight: bold;
        }

        .countdown-label {
            font-size: 9px;
            letter-spacing: 1px;
            color: #9ca3af;
            margin-top: 4px;
        }

        .event-date {
            font-size: 13px;
            letter-spacing: 2px;
            color: #e5e7eb;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .event-location {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <header>
        <span>HOME</span>
        <span>COLLECTIONS</span>
        <span>ABOUT</span>
        <span>CONTACT</span>
    </header>

    <div class="container">
        <h1 class="title-main">Secret Trend</h1>
        <div class="title-sub">Mega Student Offer</div>

        <div class="badge-btn">
            ⚡ THE MEGA LAUNCH • SOON ⚡
        </div>

        <div class="circle-box">
            <div class="circle-text">Student Offer Launch</div>
        </div>

        <button class="theme-btn">🔊 PLAY ANTHEM</button>

        <div class="countdown-container">
            <div class="countdown-box">
                <span class="countdown-number">17</span>
                <span class="countdown-label">DAYS</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number">12</span>
                <span class="countdown-label">HOURS</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number">02</span>
                <span class="countdown-label">MINUTES</span>
            </div>
            <div class="countdown-box">
                <span class="countdown-number">18</span>
                <span class="countdown-label">SECONDS</span>
            </div>
        </div>

        <div class="event-date">SATURDAY • 22 AUGUST 2026</div>
        <div class="event-location">SECRET TREND STORE, ONLINE</div>
    </div>

</body>
</html>
