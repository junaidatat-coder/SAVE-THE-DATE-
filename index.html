<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save The Date - Junaid & Ruby</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #d4af37;
            margin-bottom: 10px;
            font-size: 28px;
        }
        h2 {
            font-size: 24px;
            margin: 20px 0;
            color: #444;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.6;
            margin: 8px 0;
        }
        .date-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #d4af37;
            text-align: left;
        }
    </style>
</head>
  
<body>
    <div class="container">
        <h1>Save The Date</h1>
        <p>We are getting married!</p>pi
        <h2>Junaid & Ruby</h2>
        <div class="date-box">
            <p><strong>Date:</strong> August 22</p>
