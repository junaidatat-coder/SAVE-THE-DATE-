<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimona Textiles - Grand Opening Countdown</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b1a13;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            text-align: center;
        }

        .container {
            max-width: 450px;
            width: 100%;
            background: linear-gradient(180deg, #0e241b 0%, #07120d 100%);
            border: 2px solid #d4af37;
            border-radius: 16px;
            padding: 25px 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        .sub-tag {
            color: #e2c075;
            font-size: 1rem;
            margin-bottom: 6px;
        }

        .title {
            color: #d4af37;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .date-badge {
            display: inline-block;
            background: linear-gradient(45deg, #b8860b, #ffd700, #b8860b);
            color: #000;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            margin: 10px 0 20px 0;
        }

        /* Countdown Grid */
        .countdown {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 22px;
        }

        .time-box {
            flex: 1;
            background: rgba(5, 15, 10, 0.8);
            border: 1.5px solid #d4af37;
            border-radius: 8px;
            padding: 10px 4px;
        }

        .time-box .num {
            color: #ffd700;
            font-size: 1.7rem;
            font-weight: bold;
            display: block;
            line-height: 1;
        }

        .time-box .label {
            color: #c5a059;
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin-top: 4px;
            display: block;
            text-transform: uppercase;
        }

        .description {
            color: #e0e0e0;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .brand-section {
            border-top: 1px dashed rgba(212, 175, 55, 0.4);
            padding-top: 18px;
        }

        .brand-name {
            font-size: 2.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .brand-sub {
            color: #d4af37;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .location {
            display: inline-block;
            background-color: #d4af37;
            color: #000000;
            font-weight: bold;
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            margin-bottom: 15px;
        }

        .welcome-msg {
            color: #e2c075;
            font-size: 0.85rem;
            border: 1px solid #d4af37;
            padding: 8px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sub-tag">ഞങ്ങളുടെ സ്വപ്നം നിങ്ങളുടെ ഇഷ്ടം</div>
    <div class="title">Grand Opening</div>
    <div class="date-badge">21 / 08 / 2026</div>

    <!-- Countdown Timer -->
    <div class="countdown">
        <div class="time-box">
            <span class="num" id="days">00</span>
            <span class="label">DAYS</span>
        </div>
        <div class="time-box">
            <span class="num" id="hours">00</span>
            <span class="label">HRS</span>
        </div>
        <div class="time-box">
            <span class="num" id="minutes">00</span>
            <span class="label">MINS</span>
        </div>
        <div class="time-box">
            <span class="num" id="seconds">00</span>
            <span class="label">SECS</span>
        </div>
    </div>

    <div class="description">
        പുതിയ പ്രതീക്ഷകളോടെ... പുതിയ ശേഖരങ്ങളോടെ...<br>
        നിങ്ങളുടെ പ്രിയപ്പെട്ട ഷോപ്പ് പുതിയ വാതിൽ തുറക്കുന്നു...
    </div>

    <div class="brand-section">
        <div class="brand-name">KIMONA</div>
        <div class="brand-sub">TEXTILES & READY MADES</div>
        <div class="location">📍 AYANIKKAD</div>
    </div>

    <div class="welcome-msg">
        എല്ലാവരെയും ഹൃദയപൂർവ്വം സ്വാഗതം ചെയ്യുന്നു ❤️
    </div>
</div>

<script>
    // Set Target Date to August 21, 2026 00:00:00
    const targetDate = new Date("August 21, 2026 00:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        } else {
            document.querySelector(".countdown").innerHTML = "<h2 style='color:#ffd700; width:100%;'>WE ARE OPEN!</h2>";
        }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

</body>
</html>
