<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Independence Day Offer - Spin Wheel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
      padding: 20px;
    }

    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      text-align: center;
      max-width: 420px;
      width: 100%;
    }

    .title {
      font-size: 22px;
      font-weight: 700;
      color: #000080;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 14px;
      color: #555;
      margin-bottom: 20px;
    }

    /* Wheel Container */
    .wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 25px;
      border-radius: 50%;
      border: 8px solid #FF9933;
      background: #138808;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
      transition: transform 3s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    }

    .wheel-text {
      color: #ffffff;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
      padding: 10px;
    }

    /* Spin Button */
    .btn-spin {
      background-color: #FF9933;
      color: #fff;
      border: none;
      padding: 14px 35px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(255, 153, 51, 0.4);
      transition: all 0.3s ease;
    }

    .btn-spin:hover {
      background-color: #e68a00;
      transform: translateY(-2px);
    }

    .btn-spin:disabled {
      background-color: #ccc;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Result Box */
    .result-box {
      margin-top: 25px;
      display: none;
      animation: fadeIn 0.8s ease-in-out forwards;
    }

    .result-title {
      font-size: 16px;
      color: #333;
      margin-bottom: 8px;
    }

    .coupon-code {
      display: inline-block;
      background: #f8d7da;
      color: #721c24;
      border: 2px dashed #f5c6cb;
      padding: 10px 20px;
      font-size: 22px;
      font-weight: 800;
      border-radius: 8px;
      letter-spacing: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="title">Independence Day Special Offer</div>
    <div class="subtitle">Spin the wheel to unlock your coupon code!</div>

    <div class="wheel-container" id="wheel">
      <div class="wheel-text" id="wheelText">SPIN</div>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="startSpin()">SPIN NOW</button>

    <div class="result-box" id="resultBox">
      <div class="result-title">Go with your code:</div>
      <div class="coupon-code">FREEDOM2026</div>
    </div>
  </div>

  <script>
    function startSpin() {
      const wheel = document.getElementById('wheel');
      const wheelText = document.getElementById('wheelText');
      const spinBtn = document.getElementById('spinBtn');
      const resultBox = document.getElementById('resultBox');

      // 1947 മുതൽ 2026 വരെയുള്ള ആഘോഷങ്ങളുടെ കണക്ക് (2026 - 1947 + 1 = 80th)
      const startYear = 1947;
      const currentYear = 2026;
      const count = (currentYear - startYear) + 1; // 80th

      // ബട്ടൺ ഡിസേബിൾ ചെയ്യുക
      spinBtn.disabled = true;

      // സ്പിൻ ആനിമേഷൻ
      wheel.style.transform = "rotate(1440deg)";

      // ആനിമേഷന് ശേഷം കാണിക്കേണ്ട വിവരങ്ങൾ
      setTimeout(() => {
        wheelText.innerHTML = "Happy<br>Independence Day!<br><small style='font-size:16px;'>" + count + "th Celebration</small>";
        resultBox.style.display = "block";
      }, 3000);
    }
  </script>

</body>
</html>
