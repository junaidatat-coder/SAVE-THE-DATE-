<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimona Textiles - Grand Opening</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d0103;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* Poster Outer Card Frame */
        .poster-card {
            width: 100%;
            max-width: 420px;
            height: 750px;
            /* പുതിയ ഡിസൈൻ ബാക്ക്ഗ്രൗണ്ട് ഇമേജ് ആയി നൽകിയിരിക്കുന്നു */
            background: url('poster.jpg') no-repeat center top;
            background-size: cover;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), 0 10px 40px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            border: 2px solid #d4af37;
        }

        /* Glitter Canvas Animation Overlay */
        #glitterCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Live Working Countdown Overlay Positioned Exactly Over Poster Boxes */
        .countdown-overlay {
            position: absolute;
            top: 310px; /* പോസ്റ്ററിലെ ബോക്സിന് കൃത്യമായ അലൈൻമെന്റ് */
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 20;
            padding: 0 15px;
        }

        .time-box {
            width: 72px;
            height: 62px;
            background: rgba(22, 3, 7, 0.95);
            border: 1.5px solid #d4af37;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 8px rgba(0,0,0,0.9), 0 4px 10px rgba(0,0,0,0.5);
        }

        .time-box .num {
            color: #ffd700;
            font-size: 1.6rem;
            font-weight: bold;
            line-height: 1;
        }

        .time-box .label {
            color: #d8b467;
            font-size: 0.58rem;
            letter-spacing: 1px;
            margin-top: 3px;
            text-transform: uppercase;
        }

        /* Direct Clickable Overlay over Google Maps Button */
        .location-link {
            position: absolute;
            bottom: 100px; /* AYANIKKAD ബട്ടണിനു മുകളിലുള്ള ക്ലിക്കബിൾ ലെയർ */
            left: 50%;
            transform: translateX(-50%);
            width: 170px;
            height: 36px;
            z-index: 30;
            text-decoration: none;
            border-radius: 20px;
            background: rgba(255, 215, 0, 0.01);
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="poster-card">
    <!-- Glitter Particles Animation Canvas -->
    <canvas id="glitterCanvas"></canvas>

    <!-- Live Working Countdown Timer -->
    <div class="countdown-overlay">
        <div class="time-box">
            <span class="num" id="days">00</span>
            <span class="label">DAYS</span>
        </div>
        <div class="time-box">
            <span class="num" id="hours">00</span>
            <span class="label">HRS</span>
        </div>
        <div class="time-box">
            <span class="num" id="minutes">00</span>
            <span class="label">MINS</span>
        </div>
        <div class="time-box">
            <span class="num" id="seconds">00</span>
            <span class="label">SECS</span>
        </div>
    </div>

    <!-- Google Maps Direct Location Overlay -->
    <a href="https://maps.app.goo.gl/x9UyBW7BgeHyMwbaA?g_st=ic" target="_blank" class="location-link" title="Open Location Map"></a>
</div>

<script>
    // 1. Live Countdown Script targeting 21 August 2026
    const targetDate = new Date("August 21, 2026 00:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference > 0) {
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        } else {
            document.querySelector(".countdown-overlay").innerHTML = "<h3 style='color:#ffd700; background:rgba(0,0,0,0.8); padding:8px 15px; border-radius:10px;'>WE ARE OPEN!</h3>";
        }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    // 2. Falling Gold Glitter Particles Animation
    const canvas = document.getElementById('glitterCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const particles = [];
    const particleCount = 45;

    for (let i = 0; i < particleCount; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 3.5 + 1.2,
            speedY: Math.random() * 1.2 + 0.4,
            speedX: Math.random() * 0.6 - 0.3,
            color: ['#ffd700', '#ffe680', '#ffffff', '#d4af37'][Math.floor(Math.random() * 4)],
            opacity: Math.random() * 0.8 + 0.2
        });
    }

    function animateGlitter() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            p.y += p.speedY;
            p.x += p.speedX;

            if (p.y > canvas.height) {
                p.y = -5;
                p.x = Math.random() * canvas.width;
            }
        });

        requestAnimationFrame(animateGlitter);
    }

    animateGlitter();
</script>

</body>
</html>
