<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15th Anniversary Invitation</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        .hero { margin-bottom: 30px; }
        .countdown { font-size: 24px; font-weight: bold; color: #d35400; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .photo-box { width: 150px; }
        img { width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="hero">
        <h1>Thaha & Rashi</h1>
        <h2>15th Anniversary Coming Soon!</h2>
        <!-- ഒക്ടോബർ 1 2026-ലേക്കുള്ള കൗണ്ട്‌ഡൗൺ -->
        <div id="timer" class="countdown"></div>
    </div>

    <h3>ഞങ്ങളുടെ മക്കൾ:</h3>
    <div class="gallery">
        <div class="photo-box">
            <img src="aliya.jpg" alt="Aliya">
            <p>ആലിയ (13)</p>
        </div>
        <div class="photo-box">
            <img src="ayisha.jpg" alt="Ayisha">
            <p>ആയിഷ (9)</p>
        </div>
        <div class="photo-box">
            <img src="ifa.jpg" alt="Ifa">
            <p>ഐഫ (5)</p>
        </div>
    </div>

    <div class="footer">
        <img src="family.jpg" alt="Family Photo" style="width:300px;">
        <p>അൽഹംദുലില്ലാഹ്</p>
    </div>

    <script>
        // കൗണ്ട്ഡൗൺ സ്ക്രിപ്റ്റ്
        const targetDate = new Date("Oct 1, 2026 00:00:00").getTime();
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            document.getElementById("timer").innerHTML = days + " ദിവസങ്ങൾ ബാക്കി!";
        }, 1000);
    </script>

</body>
</html>
